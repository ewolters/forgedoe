[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgedoe"
version = "0.1.0"
description = "Design of experiments — classical, optimal, and adaptive. Pure Python."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Eric Wolters", email = "eric.wolters@svend.ai"}]

dependencies = [
    # numpy — matrix operations for design generation + regression
    # ABSORB: Python lists for small designs. Painful for large ones.
    "numpy>=1.24",

    # scipy — optimization (coordinate exchange for optimal designs),
    # stats (F-distribution, t-distribution for ANOVA/regression)
    # ABSORB: vendor specific distribution CDFs (~200 lines)
    "scipy>=1.10",
]

[project.optional-dependencies]
adaptive = [
    # scikit-learn — Gaussian process for Bayesian adaptive DOE
    # ABSORB: implement GP with numpy (~300 lines, simplified)
    "scikit-learn>=1.3",
]
all = ["forgedoe[adaptive]"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
